definitions:
  dataapi.NewAgentProfileQuery:
    properties:
      agreeableness:
        type: number
      conscientiousness:
        type: number
      context_life_time_in_days:
        type: integer
      extraversion:
        type: number
      is_context_infinite:
        type: boolean
      neuroticism:
        type: number
      openness:
        type: number
    type: object
  dataapi.SearchAgentProfileQuery:
    properties:
      apikey:
        type: string
    type: object
  emotionapi.NewContextQuery:
    properties:
      api_key:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
info:
