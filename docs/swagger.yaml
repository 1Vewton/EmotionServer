definitions:
  dataapi.GetAgentProfileQuery:
    properties:
      apikey:
        type: string
    type: object
  dataapi.NewAgentProfileQuery:
    properties:
      agreeableness:
        format: float64
        type: number
      conscientiousness:
        format: float64
        type: number
      contextLifeTimeInDays:
        type: integer
      extraversion:
        format: float64
        type: number
      isContextInfinite:
        type: boolean
      neuroticism:
        format: float64
        type: number
      openness:
        format: float64
        type: number
    type: object
  emotionapi.GetCurrentEmotionQuery:
    properties:
      apikey:
        type: string
      contextKey:
        type: string
    type: object
  emotionapi.NewContextQuery:
    properties:
      apikey:
        type: string
    type: object
  response.Response:
    properties:
      data: {}
      error:
        type: string
      success:
        type: boolean
    type: object
info:
  contact:
    email: zhanyunze0601@gmai.com
    name: 1Vewton
    url: https://github.com/1Vewton
  description: A service to simulate emotion for agent
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: Emotion Simulator
  version: "1.0"
paths:
  /v1/data/addAgentProfile:
    post:
      consumes:
      - application/json
      description: Adds profile for agent
      parameters:
      - description: Query parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dataapi.NewAgentProfileQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Adds profile for agent
      tags:
      - example
  /v1/data/getAgentProfile:
    post:
      consumes:
      - application/json
      description: Searches profile for agent
      parameters:
      - description: Query parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/dataapi.GetAgentProfileQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Searches profile for agent
      tags:
      - example
  /v1/emotion/getCurrentEmotion:
    post:
      consumes:
      - application/json
      description: Fetching current emotion(the last time updated) through api key
        and context key, returning new context key and initial emotion if context
        invalid, returning emotion if context is valid
      parameters:
      - description: Query parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/emotionapi.GetCurrentEmotionQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Getting through api key and context key
      tags:
      - example
  /v1/emotion/registerEmotion:
    post:
      consumes:
      - application/json
      description: Registers new emotion while returning a context id in the result
      parameters:
      - description: Query parameters
        in: body
        name: req
        required: true
        schema:
          $ref: '#/definitions/emotionapi.NewContextQuery'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Registers new emotion while returning a context id in the result
      tags:
      - example
  /v1/utils/health:
    get:
      consumes:
      - application/json
      description: check health
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Response'
      summary: Checks health
      tags:
      - example
swagger: "2.0"
